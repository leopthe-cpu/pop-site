<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- GitHub Pages serves this file for any missing address, at any depth, so it uses absolute
         links and inline styles only (no build assets, which are relative). -->
    <title>Page not found · Popmart</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root { --night: #0b0b0c; --cream: #f4f1e8; --muted: #9c917c; --lime: #d7ff1e; }
      html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--cream); }
      body {
        min-height: 100svh; box-sizing: border-box; display: grid; place-content: center; gap: 20px;
        padding: 24px max(16px, env(safe-area-inset-left)); text-align: center;
        font: 400 17px/1.55 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: radial-gradient(120% 90% at 30% 20%, #141416 0%, var(--night) 55%, #050506 100%) fixed;
      }
      .code { margin: 0; font: 500 12px/1.4 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 0; font: 400 clamp(44px, 9vw, 96px)/0.95 'Instrument Serif', Georgia, 'Times New Roman', serif; letter-spacing: -0.015em;
        text-shadow: 0 0 1px rgba(255,255,245,.9), 0 0 8px rgba(255,248,225,.55), 0 0 22px rgba(255,236,200,.32); }
      main { display: grid; gap: 16px; }
      p { margin: 0; color: var(--muted); }
      a.btn { justify-self: center; display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px;
        background: var(--lime); color: var(--night); font: 700 13px/1 Inter, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; }
      a.btn:hover { background: var(--cream); }
      a:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Lost in space</h1>
      <p>This page doesn't exist, or it moved.</p>
      <p style="margin-top:28px"><a class="btn" href="/">Back to popmart.studio</a></p>
    </main>
  </body>
</html>
